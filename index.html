<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tauben-Cam</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: sans-serif; }
        #remoteVideo { width: 100vw; height: 100vh; object-fit: cover; }
        #localVideo { position: absolute; bottom: 20px; right: 20px; width: 100px; height: 150px; border: 3px solid white; border-radius: 10px; z-index: 10; }
        #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; }
        #menu { position: absolute; top: 10px; left: 10px; z-index: 30; background: rgba(0,0,0,0.7); padding: 10px; color: white; border-radius: 8px; }
    </style>
</head>
<body>

<div id="menu">
    <div id="idStatus">ID laden...</div>
    <input type="text" id="targetId" placeholder="ID eingeben" style="width:80px">
    <button onclick="startCall()">Anrufen</button>
</div>

<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    const peer = new Peer(Math.floor(1000 + Math.random() * 9000).toString());
    const remoteVid = document.getElementById('remoteVideo');
    const localVid = document.getElementById('localVideo');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let seeds = [];

    // Kamera starten (Selfie)
    navigator.mediaDevices.getUserMedia({video: {facingMode: "user"}, audio: true})
        .then(stream => localVid.srcObject = stream);

    peer.on('open', id => document.getElementById('idStatus').innerText = "Deine ID: " + id);

    // Anruf empfangen
    peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
            call.answer(stream);
            call.on('stream', s => remoteVid.srcObject = s);
        });
    });

    // Anruf starten
    function startCall() {
        const id = document.getElementById('targetId').value;
        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
            const call = peer.call(id, stream);
            call.on('stream', s => remoteVid.srcObject = s);
        });
    }

    // Samen zeichnen
    canvas.addEventListener('click', e => {
        const seed = {x: e.clientX, y: e.clientY, time: Date.now()};
        seeds.push(seed);
        setTimeout(() => seeds = seeds.filter(s => s !== seed), 5000);
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        seeds.forEach(s => {
            ctx.fillStyle = 'yellow';
            ctx.beginPath();
            ctx.arc(s.x, s.y, 10, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
